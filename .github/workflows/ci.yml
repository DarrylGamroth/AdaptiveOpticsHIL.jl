name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            julia-version: "1.12"
          - os: macos-15
            julia-version: "1.12"
          - os: windows-latest
            julia-version: "1.12"
    env:
      JULIA_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v3

      - name: Verify Apple Silicon runner
        if: matrix.os == 'macos-15'
        run: julia --startup-file=no -e 'using InteractiveUtils; Sys.isapple() && Sys.ARCH === :aarch64 || error("SPSC layout validation requires the maintained Apple Silicon runner"); versioninfo()'

      - name: Instantiate
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.instantiate()'

      - name: Run test suite
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.test()'

  ownership-stress:
    name: Ownership stress / Julia 1.12 / ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JULIA_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v3

      - name: Instantiate
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.instantiate()'

      - name: Run two-owner ownership stress
        run: julia --project=. --startup-file=no test/ownership_concurrency.jl

  benchmark-contract:
    name: Gate 4A benchmark contract / Julia 1.12 / ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JULIA_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v3

      - name: Instantiate benchmark environment
        run: julia --project=benchmarks --startup-file=no -e 'using Pkg; Pkg.instantiate()'

      - name: Validate benchmark contract and deterministic smoke path
        run: julia --project=benchmarks --startup-file=no benchmarks/test/runtests.jl
