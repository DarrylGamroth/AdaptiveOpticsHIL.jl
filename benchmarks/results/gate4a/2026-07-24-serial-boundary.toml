    [contract.contract]
    absolute_latency_gate = "fixed-arrival p99 publication lateness and adapter observation delay must each be no more than one 500 us frame period, while product-ready to first command-responsive optical sample p99 must be no more than 1 ms"
    allocation_gate = "preconfigured clock/schedule/counter/histogram instrumentation adds zero warmed Julia heap bytes; the inclusive reduced-order core plus HIL boundary may use at most 16384 bytes per completed primary frame over a 1000-frame window"
    coordinated_omission_correction = false
    coordinated_omission_reason = "the absolute generator continues to count deadlines during the injected stall; no omitted arrival is reconstructed after the fact"
    correctness_oracle = "exact cached-clock replay; matched reduced-order control; equal-time core causality; monotonically contiguous product/command/outcome sequences; stall interval offered-count growth; bounded occupancy; and quiescent stop accounting"
    fixed_arrival_model = "100000 absolute product-ready deadlines at first_ready_ns + (sequence - 1) * period_ns; cumulative offered work is derived from that schedule and clamped only at the declared finite run length"
    fixed_load_model = "schedule-preserving finite open-loop arrival schedule; simulator pacing follows absolute execution-clock deadlines while the in-memory RTC consumer is deliberately withheld for a bounded interval"
    idle_policy = "the benchmark owner busy-spins on positive SerialDeadlinePending results; the runtime itself never sleeps or polls"
    question = "At a finite 2 kHz reduced-order WFS schedule, does the serial CPU HIL boundary retain every absolute offered deadline through an injected RTC-consumer stall, keep complete-product publication and closed-loop p99 within their declared bounds outside no hidden arrival pause, and reconcile every command outcome and payload/product lease; and what useful throughput does the identical boundary sustain when pacing is removed?"
    relative_latency_gate = "this first fixed-arrival Gate 4A artifact establishes the comparable baseline; no retroactive relative gate is evaluated"
    saturation_claim_limit = "unpaced results diagnose this one-process serial reduced-order boundary and are not fixed-arrival latency or external-RTC capacity evidence"
    saturation_load_model = "unpaced self-paced serial maximum-useful-throughput diagnostic over the same prepared plant, complete-product ports, leased command submissions, terminal outcomes, and fake controller"
    tail_claim = "p50, p90, and p99 require at least 10000 samples; p99.9 is promoted only by the durable 100000-sample runs"
    threading = "one Julia thread, one BLAS thread, and no package-owned worker"
    timed_boundaries = "complete-product readiness to HIL publication; HIL publication to adapter observation; observation through command transfer; transfer through semantic admission; transfer through applied terminal outcome publication; and complete-product readiness through the first optical sample affected by the correlated command"
    timer = "Clocks.SystemNanoClock for fixed-arrival pacing and boundary timestamps; time_ns for unpaced service cost; histogram recording is excluded from each boundary value but included in achieved throughput"
    warmup_protocol = "compile the concrete SystemNanoClock boundary on a sacrificial slow schedule, discard it, then execute one unrecorded 2000-frame 2 kHz run; every recorded finite run is freshly prepared and armed afterward, while package import, preparation, compilation, and warmup are excluded"

